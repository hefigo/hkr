<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Page!</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/cb76f6d5ed.js" crossorigin="anonymous"></script>
</head>
<body>

    <header>
        <p class="top-part"><a href="index.html">About Me</a></p>
        <p class="top-part"><a href="gallery.html">Gallery</a></p>
        <p class="top-part"><a href="contact.html">Contact Me!</a></p>
    </header>
    
    

    <div class="contact-container">
        <p style="padding:10px; text-align: center;">If you'd like to contact me, please submit the following form:</p>
        <form id="contact-form">
           <input name="firstname" type="text" id="first-name" placeholder="Your first name here..." novalidate>
           <small id="first-name-error"></small>
           <input name="lastname" type="text" id="last-name" placeholder="Your last name here..." novalidate>
           <small id="last-name-error"></small>
           <input name="email" type="email" id="email" placeholder="Your email here..." novalidate>
           <small id="email-error"></small>
           <input name="phone" type="tel" maxlength="13" id="phone-number" placeholder="Your phone number here...">
           <label for="subject">Subject of your message?</label>
           <select name="subject" id="subject">
                <option value="intro">Introduce Yourself!</option>
                <option value="website">Website Suggestion</option>
                <option value="meeting">Lets schedule a meeting!</option>

           </select>
           <textarea name="message" id="message" minlength="20" placeholder="Write your text here..." novalidate></textarea>
           <small id="message-error"></small>
           <div class="button-container">
            <input type="submit" value="Submit :)" id="submit-button">
            <input id="reset-button" type="reset" value="Reset"></div>
            
        </form>


    </div>


    <footer> <i class="fa-brands fa-linkedin"></i> <a style="color:white; text-decoration: none;" id="linkedin" href="" target="_blank" > By clicking here you can find my <b>LinkedIn</b></a>

        <i class="fa-solid fa-face-smile"></i>

        <span class="footer-smiles">
            <i class="fa-solid fa-face-smile"></i>
            <i class="fa-regular fa-face-smile"></i>
            <i class="fa-solid fa-face-smile"></i>

        </span>
    </footer>




<script src="script.js"></script>
</body>




</html>
