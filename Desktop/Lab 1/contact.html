<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Page!</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet">

<body>

    <header>
        <p class="top-part"><a href="index.html">About Me</a></p>
        <p class="top-part"><a href="gallery.html">Gallery</a></p>
        <p class="top-part"><a href="contact.html">Contact Me!</a></p>
    </header>
    
    

    <div class="contact-container">
        <form id="contact-form">
           <input name="name" type="text" id="first-name" placeholder="Your first name here...">
           <input name="name" type="text" id="last-name" placeholder="Your last name here...">
           <input name="email" type="email" id="email" placeholder="Your email here...">
           <label for="subject">Subject of your message?</label>
           <select name="subject" id="subject">
                <option value="intro">Introduce Yourself!</option>
                <option value="website">Website Suggestion</option>
                <option value="meeting">Lets schedule a meeting!</option>

           </select>
           <textarea name="message" id="message" placeholder="Write your text here..."></textarea>
           <input type="submit" value="Submit :)" id="submit-button">

        </form>


    </div>


    <footer> <i class="fa-brands fa-linkedin"></i> <a style="color:white; text-decoration: none;" id="linkedin" href="https://www.linkedin.com/in/helena-figueroa-ortiz-643a1a343" target="_blank" > By clicking here you can find my <b>LinkedIn</b></a>

        <i class="fa-solid fa-face-smile"></i>

        <span class="footer-smiles">
            <i class="fa-solid fa-face-smile"></i>
            <i class="fa-regular fa-face-smile"></i>
            <i class="fa-solid fa-face-smile"></i>

        </span>
    </footer>





</body>

<script src="script.js"></script>
